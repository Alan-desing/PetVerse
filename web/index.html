<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PetVerse: comparte momentos y encuentra una comunidad para ti y tus mascotas.">
  <meta name="theme-color" content="#FF7043">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="PetVerse">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>PetVerse | Comunidad para mascotas</title>
</head>
<body>
  <button id="petverse-install-trigger" type="button" hidden aria-hidden="true"></button>
  <script>
    (() => {
      const installTrigger = document.getElementById('petverse-install-trigger');
      let deferredInstallPrompt = null;
      const installed = window.matchMedia('(display-mode: standalone)').matches;
      installTrigger.dataset.installAvailable = 'false';
      installTrigger.dataset.installed = String(installed);

      window.addEventListener('beforeinstallprompt', (event) => {
        event.preventDefault();
        deferredInstallPrompt = event;
        installTrigger.dataset.installAvailable = 'true';
        window.dispatchEvent(new Event('petverse-install-available'));
      });

      window.addEventListener('appinstalled', () => {
        deferredInstallPrompt = null;
        installTrigger.dataset.installAvailable = 'false';
        installTrigger.dataset.installed = 'true';
        window.dispatchEvent(new Event('petverse-install-complete'));
      });

      installTrigger.addEventListener('click', async () => {
        if (!deferredInstallPrompt) return;
        const prompt = deferredInstallPrompt;
        deferredInstallPrompt = null;
        installTrigger.dataset.installAvailable = 'false';
        await prompt.prompt();
        const choice = await prompt.userChoice;
        if (choice.outcome === 'accepted') {
          installTrigger.dataset.installed = 'true';
          window.dispatchEvent(new Event('petverse-install-complete'));
        } else {
          window.dispatchEvent(new Event('petverse-install-dismissed'));
        }
      });
    })();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const workerUrl = new URL('petverse-sw.js', document.baseURI);
        navigator.serviceWorker.register(workerUrl).catch((error) => {
          console.warn('PetVerse no pudo registrar el modo sin conexión.', error);
        });
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
